<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1120" height="400" rx="12" fill="#fffdf9"/>
  <text x="36" y="42" font-size="18" fill="#17140f" font-weight="bold">全国婚姻登记数据：结婚登记对数（万对）</text>
  <text x="36" y="66" font-size="12" fill="#6d675b">口径：民政部历年统计公报及新闻发布会公开数据（四舍五入）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="320" x2="1060" y2="320" stroke="#ddd5c6" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="320" stroke="#ddd5c6" stroke-width="1"/>

  <!-- 网格参考线 -->
  <line x1="90" y1="90" x2="1060" y2="90" stroke="#efeadf" stroke-width="1"/>
  <text x="82" y="94" font-size="11" fill="#928c7e" text-anchor="end">1347</text>
  <line x1="90" y1="205" x2="1060" y2="205" stroke="#efeadf" stroke-width="1"/>
  <text x="82" y="209" font-size="11" fill="#928c7e" text-anchor="end">673</text>

  <!-- 2013 -->
  <rect x="130" y="100" width="110" height="220" rx="4" fill="#22384f"/>
  <text x="185" y="92" font-size="14" fill="#17140f" text-anchor="middle" font-weight="bold">1346.9</text>
  <text x="185" y="344" font-size="13" fill="#6d675b" text-anchor="middle">2013</text>
  <text x="185" y="364" font-size="11" fill="#928c7e" text-anchor="middle">历史峰值</text>

  <!-- 2019 -->
  <rect x="330" y="168.6" width="110" height="151.4" rx="4" fill="#22384f"/>
  <text x="385" y="161" font-size="14" fill="#17140f" text-anchor="middle" font-weight="bold">927.3</text>
  <text x="385" y="344" font-size="13" fill="#6d675b" text-anchor="middle">2019</text>
  <text x="385" y="364" font-size="11" fill="#928c7e" text-anchor="middle">跌破千万</text>

  <!-- 2021 -->
  <rect x="530" y="195.3" width="110" height="124.7" rx="4" fill="#22384f"/>
  <text x="585" y="188" font-size="14" fill="#17140f" text-anchor="middle" font-weight="bold">763.6</text>
  <text x="585" y="344" font-size="13" fill="#6d675b" text-anchor="middle">2021</text>
  <text x="585" y="364" font-size="11" fill="#928c7e" text-anchor="middle">民法典施行当年</text>

  <!-- 2023 -->
  <rect x="730" y="194.5" width="110" height="125.5" rx="4" fill="#2f6b4f"/>
  <text x="785" y="187" font-size="14" fill="#17140f" text-anchor="middle" font-weight="bold">768.2</text>
  <text x="785" y="344" font-size="13" fill="#6d675b" text-anchor="middle">2023</text>
  <text x="785" y="364" font-size="11" fill="#928c7e" text-anchor="middle">疫后小幅回升</text>

  <!-- 2024 -->
  <rect x="930" y="220.3" width="110" height="99.7" rx="4" fill="#8a3324"/>
  <text x="985" y="213" font-size="14" fill="#8a3324" text-anchor="middle" font-weight="bold">610.6</text>
  <text x="985" y="344" font-size="13" fill="#6d675b" text-anchor="middle">2024</text>
  <text x="985" y="364" font-size="11" fill="#928c7e" text-anchor="middle">再创新低</text>

  <text x="36" y="388" font-size="11" fill="#928c7e">读法：数据不是立场，是背景。结婚对数下行意味着婚恋决策更审慎，也意味着围绕彩礼、房产的博弈更密集——这正是本站存在的理由。</text>
</svg>
