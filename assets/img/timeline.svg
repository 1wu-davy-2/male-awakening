<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1120" height="340" rx="12" fill="#fffdf9"/>
  <rect x="0" y="0" width="1120" height="52" fill="#17140f"/>
  <text x="28" y="33" font-size="17" fill="#f6f3ed" font-weight="bold">婚恋家事相关立法与权威发布 · 大事记（2016–2025）</text>
  <text x="1092" y="33" font-size="11" fill="#928c7e" text-anchor="end">日期均为施行/发布口径</text>

  <line x1="70" y1="196" x2="1050" y2="196" stroke="#ddd5c6" stroke-width="2"/>
  <polygon points="1050,196 1038,190 1038,202" fill="#ddd5c6"/>

  <!-- 2016 反家暴法 -->
  <circle cx="120" cy="196" r="7" fill="#8a3324"/>
  <rect x="62" y="92" width="150" height="78" rx="8" fill="#f4e7e2" stroke="#e2c5ba"/>
  <text x="137" y="114" font-size="14" fill="#8a3324" font-weight="bold" text-anchor="middle">2016-03-01</text>
  <text x="137" y="134" font-size="12.5" fill="#17140f" text-anchor="middle">《反家庭暴力法》施行</text>
  <text x="137" y="154" font-size="11" fill="#6d675b" text-anchor="middle">人身安全保护令制度</text>
  <line x1="120" y1="170" x2="120" y2="189" stroke="#c9bfb0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 2021 民法典 -->
  <circle cx="330" cy="196" r="7" fill="#22384f"/>
  <rect x="258" y="222" width="164" height="78" rx="8" fill="#e6ecf2" stroke="#c3d1de"/>
  <text x="340" y="244" font-size="14" fill="#22384f" font-weight="bold" text-anchor="middle">2021-01-01</text>
  <text x="340" y="264" font-size="12.5" fill="#17140f" text-anchor="middle">《民法典》施行</text>
  <text x="340" y="284" font-size="11" fill="#6d675b" text-anchor="middle">婚姻家庭编 + 解释（一）同日施行</text>
  <line x1="330" y1="203" x2="330" y2="222" stroke="#c9bfb0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 2022 法律援助法 -->
  <circle cx="530" cy="196" r="7" fill="#2f6b4f"/>
  <rect x="462" y="92" width="150" height="78" rx="8" fill="#e4efe9" stroke="#c2d8cb"/>
  <text x="537" y="114" font-size="14" fill="#2f6b4f" font-weight="bold" text-anchor="middle">2022-01-01</text>
  <text x="537" y="134" font-size="12.5" fill="#17140f" text-anchor="middle">《法律援助法》施行</text>
  <text x="537" y="154" font-size="11" fill="#6d675b" text-anchor="middle">12348 免费援助入法</text>
  <line x1="530" y1="170" x2="530" y2="189" stroke="#c9bfb0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 2024 涉彩礼规定 -->
  <circle cx="740" cy="196" r="9" fill="#8a3324"/>
  <circle cx="740" cy="196" r="14" fill="none" stroke="#8a3324" stroke-width="1.5" opacity="0.5"/>
  <rect x="668" y="222" width="164" height="78" rx="8" fill="#f4e7e2" stroke="#e2c5ba"/>
  <text x="750" y="244" font-size="14" fill="#8a3324" font-weight="bold" text-anchor="middle">2024-02-01</text>
  <text x="750" y="264" font-size="12.5" fill="#17140f" text-anchor="middle">涉彩礼纠纷司法解释施行</text>
  <text x="750" y="284" font-size="11" fill="#6d675b" text-anchor="middle">2024-01 发布 + 典型案例</text>
  <line x1="740" y1="203" x2="740" y2="222" stroke="#c9bfb0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 2025 解释（二） -->
  <circle cx="950" cy="196" r="9" fill="#9a7b3f"/>
  <circle cx="950" cy="196" r="14" fill="none" stroke="#9a7b3f" stroke-width="1.5" opacity="0.5"/>
  <rect x="878" y="92" width="164" height="78" rx="8" fill="#f5eedd" stroke="#e0d2ae"/>
  <text x="960" y="114" font-size="14" fill="#9a7b3f" font-weight="bold" text-anchor="middle">2025-02-01</text>
  <text x="960" y="134" font-size="12.5" fill="#17140f" text-anchor="middle">婚姻家庭编解释（二）施行</text>
  <text x="960" y="154" font-size="11" fill="#6d675b" text-anchor="middle">房产给予 · 父母出资 · 同居析产</text>
  <line x1="950" y1="170" x2="950" y2="189" stroke="#c9bfb0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="70" y="330" font-size="11" fill="#928c7e">资料口径：全国人大网 / 最高人民法院官网 / 中国政府网 公开发布信息；条文表述详见本站附录法条速查。</text>
</svg>
