<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1120" height="430" rx="12" fill="#fffdf9"/>
  <!-- 海报头 -->
  <rect x="0" y="0" width="1120" height="86" fill="#8a3324"/>
  <text x="36" y="38" font-size="13" fill="#f4d7cd" letter-spacing="3">最高人民法院 · 司法解释 · 权威发布</text>
  <text x="36" y="68" font-size="24" fill="#fffdf9" font-weight="bold">《关于审理涉彩礼纠纷案件适用法律若干问题的规定》</text>
  <rect x="920" y="22" width="168" height="44" rx="6" fill="#17140f"/>
  <text x="1004" y="50" font-size="16" fill="#f6f3ed" text-anchor="middle" font-weight="bold">2024-02-01 施行</text>

  <!-- 要点卡 -->
  <rect x="36" y="112" width="336" height="150" rx="10" fill="#f4e7e2" stroke="#e2c5ba"/>
  <circle cx="68" cy="146" r="15" fill="#8a3324"/>
  <text x="68" y="151" font-size="14" fill="#fffdf9" text-anchor="middle" font-weight="bold">1</text>
  <text x="96" y="151" font-size="15" fill="#17140f" font-weight="bold">重申禁止借婚姻索取财物</text>
  <text x="56" y="180" font-size="12.5" fill="#3b3830">一方以彩礼为名借婚姻索取财物，</text>
  <text x="56" y="200" font-size="12.5" fill="#3b3830">另一方要求返还的，人民法院予以</text>
  <text x="56" y="220" font-size="12.5" fill="#3b3830">支持（条文要旨）。</text>

  <rect x="392" y="112" width="336" height="150" rx="10" fill="#f4e7e2" stroke="#e2c5ba"/>
  <circle cx="424" cy="146" r="15" fill="#8a3324"/>
  <text x="424" y="151" font-size="14" fill="#fffdf9" text-anchor="middle" font-weight="bold">2</text>
  <text x="452" y="151" font-size="15" fill="#17140f" font-weight="bold">彩礼与恋爱赠与划清界限</text>
  <text x="412" y="180" font-size="12.5" fill="#3b3830">节日红包、日常消费等一般赠与</text>
  <text x="412" y="200" font-size="12.5" fill="#3b3830">不属于彩礼；以结婚为目的的大额</text>
  <text x="412" y="220" font-size="12.5" fill="#3b3830">给付才进入彩礼返还规则。</text>

  <rect x="748" y="112" width="336" height="150" rx="10" fill="#f4e7e2" stroke="#e2c5ba"/>
  <circle cx="780" cy="146" r="15" fill="#8a3324"/>
  <text x="780" y="151" font-size="14" fill="#fffdf9" text-anchor="middle" font-weight="bold">3</text>
  <text x="808" y="151" font-size="15" fill="#17140f" font-weight="bold">已登记并共同生活原则上不返还</text>
  <text x="768" y="180" font-size="12.5" fill="#3b3830">但共同生活时间较短且彩礼数额</text>
  <text x="768" y="200" font-size="12.5" fill="#3b3830">过高的，可结合孕育、过错、彩礼</text>
  <text x="768" y="220" font-size="12.5" fill="#3b3830">用途等酌定是否返还及比例。</text>

  <!-- 裁量变量条 -->
  <rect x="36" y="288" width="1048" height="64" rx="10" fill="#efeadf"/>
  <text x="60" y="314" font-size="13" fill="#8a3324" font-weight="bold">返还比例的六个裁量变量</text>
  <text x="60" y="338" font-size="13" fill="#3b3830">共同生活时长 · 是否孕育子女 · 数额与当地收入比值 · 彩礼实际用途 · 双方过错 · 给付方家庭经济状况</text>

  <text x="36" y="392" font-size="11.5" fill="#928c7e">发布：2024 年 1 月最高人民法院新闻发布会，同步发布涉彩礼纠纷典型案例。</text>
  <text x="36" y="412" font-size="11.5" fill="#928c7e">原文检索：最高人民法院官网（court.gov.cn）→ 新闻发布 / 权威发布；本站详解见第二篇 s2-3。</text>
</svg>
