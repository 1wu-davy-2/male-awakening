<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="1120" height="430" rx="12" fill="#fffdf9"/>
  <rect x="0" y="0" width="1120" height="86" fill="#22384f"/>
  <text x="36" y="38" font-size="13" fill="#c3d1de" letter-spacing="3">最高人民法院 · 司法解释 · 权威发布</text>
  <text x="36" y="68" font-size="24" fill="#f6f3ed" font-weight="bold">《民法典婚姻家庭编解释（二）》</text>
  <rect x="920" y="22" width="168" height="44" rx="6" fill="#17140f"/>
  <text x="1004" y="50" font-size="16" fill="#f6f3ed" text-anchor="middle" font-weight="bold">2025-02-01 施行</text>

  <rect x="36" y="112" width="336" height="136" rx="10" fill="#e6ecf2" stroke="#c3d1de"/>
  <text x="60" y="146" font-size="15" fill="#22384f" font-weight="bold">① 违反忠实义务处分财产</text>
  <text x="56" y="176" font-size="12.5" fill="#3b3830">婚姻存续期间一方将共同财产</text>
  <text x="56" y="196" font-size="12.5" fill="#3b3830">赠与婚外第三人的，另一方请求</text>
  <text x="56" y="216" font-size="12.5" fill="#3b3830">确认无效并返还，法院支持</text>
  <text x="56" y="236" font-size="12.5" fill="#3b3830">（规则要旨）。</text>

  <rect x="392" y="112" width="336" height="136" rx="10" fill="#e6ecf2" stroke="#c3d1de"/>
  <text x="416" y="146" font-size="15" fill="#22384f" font-weight="bold">② 抢夺藏匿子女有了救济</text>
  <text x="412" y="176" font-size="12.5" fill="#3b3830">一方抢夺、藏匿未成年子女的，</text>
  <text x="412" y="196" font-size="12.5" fill="#3b3830">另一方可以申请人身安全保护令</text>
  <text x="412" y="216" font-size="12.5" fill="#3b3830">或参照适用的行为保全措施</text>
  <text x="412" y="236" font-size="12.5" fill="#3b3830">（规则要旨）。</text>

  <rect x="748" y="112" width="336" height="136" rx="10" fill="#e6ecf2" stroke="#c3d1de"/>
  <text x="772" y="146" font-size="15" fill="#22384f" font-weight="bold">③ 父母出资购房规则细化</text>
  <text x="768" y="176" font-size="12.5" fill="#3b3830">婚后父母出资购房、登记在一方</text>
  <text x="768" y="196" font-size="12.5" fill="#3b3830">子女名下等情形，离婚时如何认定</text>
  <text x="768" y="216" font-size="12.5" fill="#3b3830">与补偿，规则进一步明确</text>
  <text x="768" y="236" font-size="12.5" fill="#3b3830">（规则要旨）。</text>

  <rect x="36" y="272" width="336" height="112" rx="10" fill="#f5eedd" stroke="#e0d2ae"/>
  <text x="60" y="304" font-size="15" fill="#9a7b3f" font-weight="bold">④ 同居析产有了裁判规则</text>
  <text x="56" y="332" font-size="12.5" fill="#3b3830">同居期间财产分割纠纷的处理</text>
  <text x="56" y="352" font-size="12.5" fill="#3b3830">规则得到统一，恋爱同居不再是</text>
  <text x="56" y="372" font-size="12.5" fill="#3b3830">法律真空地带（规则要旨）。</text>

  <rect x="392" y="272" width="336" height="112" rx="10" fill="#f5eedd" stroke="#e0d2ae"/>
  <text x="416" y="304" font-size="15" fill="#9a7b3f" font-weight="bold">⑤ 夫妻间房产给予约定</text>
  <text x="412" y="332" font-size="12.5" fill="#3b3830">婚前/婚内约定把房产"给予"对方</text>
  <text x="412" y="352" font-size="12.5" fill="#3b3830">的，离婚时按约定并结合实际情况</text>
  <text x="412" y="372" font-size="12.5" fill="#3b3830">综合处理（规则要旨）。</text>

  <rect x="748" y="272" width="336" height="112" rx="10" fill="#f5eedd" stroke="#e0d2ae"/>
  <text x="772" y="304" font-size="15" fill="#9a7b3f" font-weight="bold">⑥ 对你的意义</text>
  <text x="768" y="332" font-size="12.5" fill="#3b3830">①③⑤直击"钱"的三条主干线，</text>
  <text x="768" y="352" font-size="12.5" fill="#3b3830">本站第二篇、第七篇的对应章节</text>
  <text x="768" y="372" font-size="12.5" fill="#3b3830">均已按此规则更新表述。</text>

  <text x="36" y="412" font-size="11.5" fill="#928c7e">原文检索：最高人民法院官网（court.gov.cn）→ 权威发布；以上为规则要旨，适用以条文原文为准。</text>
</svg>
